<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogAI — Sign In</title>
    <meta name="description" content="Sign in to LogAI to unlock 20 daily analyses and full history access.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Anti-FOUC: load saved theme before render -->
    <script>
        (function () {
            var t = localStorage.getItem("logai_theme") || "dark";
            var link = document.createElement("link");
            link.id  = "theme-css";
            link.rel = "stylesheet";
            link.href = "themes/" + t + ".css";
            document.head.appendChild(link);
        })();
    </script>

    <!-- Base styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Page-specific styles -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-glow"></div>

    <div class="lc">
        <!-- Brand -->
        <a href="index.html" class="lc-brand">
            <div class="lc-logo">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"
                        stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="lc-brand-name">LogAI</span>
        </a>

        <!-- Back link -->
        <a href="index.html" class="lc-back">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5M5 12L12 19M5 12L12 5"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to dashboard
        </a>

        <div class="lc-title">Welcome back</div>
        <div class="lc-sub">Sign in to unlock 20 daily analyses and full history access.</div>

        <div class="lc-alert error" id="loginError"></div>
        <div class="lc-alert success" id="loginSuccess"></div>

        <div class="lc-field">
            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div class="lc-field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
        </div>

        <button class="lc-btn-primary" id="loginBtn">
            <span id="loginBtnText">Sign In</span>
            <div class="lc-spinner" id="loginSpinner"></div>
        </button>

        <div class="lc-divider">or</div>

        <button class="lc-btn-secondary" id="signupBtn">Create Account</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
