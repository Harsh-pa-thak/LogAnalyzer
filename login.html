<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogAI — Sign In</title>
    <meta name="description" content="Sign in to LogAI to unlock 20 daily analyses and full history access.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Anti-FOUC: apply saved theme instantly before any paint -->
    <script>
        document.documentElement.setAttribute(
            'data-theme',
            localStorage.getItem('logai_theme') || 'dark'
        );
    </script>

    <!-- Base styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Page-specific styles -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="lc">
        <!-- Brand -->
        <a href="index.html" class="lc-brand">
            <div class="lc-logo">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z"
                        stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <span class="lc-brand-name">LogAI</span>
        </a>

        <!-- Back link -->
        <a href="index.html" class="lc-back">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5M5 12L12 19M5 12L12 5"
                    stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to dashboard
        </a>

        <div class="lc-title">Welcome back</div>
        <div class="lc-sub">Sign in to unlock 20 daily analyses and full history access.</div>

        <div class="lc-alert error" id="loginError"></div>
        <div class="lc-alert success" id="loginSuccess"></div>

        <div class="lc-field">
            <label for="loginEmail">Email address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
        </div>
        <div class="lc-field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
        </div>

        <button class="lc-btn-primary" id="loginBtn">
            <span id="loginBtnText">Sign In</span>
            <div class="lc-spinner" id="loginSpinner"></div>
        </button>

        <div class="lc-divider">or</div>

        <button class="lc-btn-github" id="githubBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
            </svg>
            Continue with GitHub
        </button>

        <button class="lc-btn-secondary" id="signupBtn">Create Account</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>
</body>
</html>
